<title>Bears vs Pirates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-screen stage. A 16:9 game canvas sits letterboxed on a deep-sea backdrop; storybook menu cards float over it, sized in container units so they scale with the game. */
:root{
  --sea:#17465a;
  --sea-deep:#0c2633;
  --honey:#f6b73c;
  --honey-hi:#ffc95e;
  --cream:#fff5df;
  --ink:#3b2412;
  --rose:#e8606f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;
  background:var(--sea-deep) radial-gradient(120% 90% at 50% 40%,var(--sea),var(--sea-deep));
  color:var(--cream);font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
.stage{
  position:relative;
  width:min(100%,calc((100vh - 40px) * 16 / 9));
  width:min(100%,calc((100dvh - 40px) * 16 / 9));
  max-width:100%;aspect-ratio:16/9;
  container-type:inline-size;
  border-radius:14px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 4px var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,38,51,.55)}
.overlay.clear{background:linear-gradient(180deg,rgba(12,38,51,0) 30%,rgba(12,38,51,.35))}
.card{
  background:var(--cream);color:var(--ink);
  border:.35cqw solid var(--ink);border-radius:2.4cqw;
  padding:2.2cqw 3.2cqw;box-shadow:0 .7cqw 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:1.2cqw;
  text-align:center;max-width:64cqw;
}
.card h2{font-family:var(--display);font-weight:400;font-size:4.6cqw;line-height:1;margin:0;text-wrap:balance}
.card p{margin:0;font-size:1.75cqw;line-height:1.4;font-weight:700;max-width:46cqw;text-wrap:pretty}
.eyebrow{font-family:var(--display);font-size:1.5cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.row{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--display);font-size:2.4cqw;line-height:1;color:var(--ink);
  background:var(--honey);border:.3cqw solid var(--ink);border-radius:1.6cqw;
  padding:1cqw 2.6cqw;box-shadow:0 .45cqw 0 var(--ink);cursor:pointer;
}
.btn:hover{background:var(--honey-hi)}
.btn:active{transform:translateY(.3cqw);box-shadow:0 .15cqw 0 var(--ink)}
.btn:focus-visible,.lvl:focus-visible{outline:.35cqw solid var(--cream);outline-offset:.3cqw}
.btn.ghost{background:var(--cream)}
.btn.ghost:hover{background:#fff}
.btn.big{font-size:3.4cqw;padding:1.2cqw 4.4cqw}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:1.6cqw;transform:translateY(-3cqw)}
.logo{font-family:var(--display);font-weight:400;margin:0;line-height:.86;text-align:center;letter-spacing:.01em}
.logo span{display:block;-webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;text-shadow:0 .7cqw 0 var(--ink)}
.logo .a{font-size:9.5cqw;color:var(--honey)}
.logo .vs{font-size:4cqw;color:var(--cream);margin-block:.4cqw}
.logo .b{font-size:9.5cqw;color:var(--rose)}
.dedication{font-weight:800;font-size:1.7cqw;color:var(--ink);background:var(--cream);border:.25cqw solid var(--ink);border-radius:99px;padding:.5cqw 1.8cqw}
.dedication b{color:var(--rose)}

/* level map */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw}
.lvl{
  width:17cqw;min-height:10.5cqw;box-sizing:border-box;
  font-family:var(--body);color:var(--ink);text-align:left;
  background:#d9f0c8;border:.3cqw solid var(--ink);border-radius:1.6cqw;
  padding:1cqw 1.3cqw;box-shadow:0 .45cqw 0 var(--ink);cursor:pointer;
  display:flex;flex-direction:column;gap:.3cqw;
}
.lvl:hover:not(:disabled){background:#e8f7dc}
.lvl .n{font-family:var(--display);font-size:3.4cqw;line-height:1}
.lvl .nm{font-weight:900;font-size:1.55cqw;line-height:1.15}
.lvl .sub{font-weight:700;font-size:1.2cqw;opacity:.75}
.lvl.done{background:#ffe7ae}
.lvl:disabled{background:#cfc6b4;cursor:not-allowed;opacity:.7}

#prev{width:13cqw;height:13cqw}
.rotate-hint{display:none;font-weight:800;font-size:14px;text-align:center;opacity:.85}
@media (orientation:portrait) and (max-width:820px){.rotate-hint{display:block}}
</style>

<div class="stage" id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Bears vs Pirates game board"></canvas>

  <div class="overlay clear" id="ov-title">
    <div class="title">
      <h1 class="logo"><span class="a">Bears</span><span class="vs">vs</span><span class="b">Pirates</span></h1>
      <button class="btn big" id="btn-play">Play</button>
      <div class="dedication" id="dedication"></div>
    </div>
  </div>

  <div class="overlay" id="ov-levels" hidden>
    <div class="card">
      <div class="eyebrow">Treasure map</div>
      <h2>Pick a beach</h2>
      <div class="levels" id="levels"></div>
      <div class="row"><button class="btn ghost" id="btn-back">Back</button></div>
    </div>
  </div>

  <div class="overlay" id="ov-pause" hidden>
    <div class="card">
      <div class="eyebrow">Snack break</div>
      <h2>Paused</h2>
      <div class="row">
        <button class="btn" id="btn-resume">Keep playing</button>
        <button class="btn ghost" id="btn-restart">Restart level</button>
        <button class="btn ghost" id="btn-map1">Level map</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov-win" hidden>
    <div class="card">
      <div class="eyebrow" id="win-eyebrow">Picnic saved</div>
      <h2 id="win-title">You did it!</h2>
      <canvas id="prev" width="260" height="260"></canvas>
      <p id="win-text"></p>
      <div class="row">
        <button class="btn" id="btn-next">Next level</button>
        <button class="btn ghost" id="btn-map2">Level map</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov-lose" hidden>
    <div class="card">
      <div class="eyebrow">Oh no</div>
      <h2>The pirates got the honey!</h2>
      <p>A pirate snuck past the beach balls. Plant more Honey Bears early so you can afford more friends.</p>
      <div class="row">
        <button class="btn" id="btn-retry">Try again</button>
        <button class="btn ghost" id="btn-map3">Level map</button>
      </div>
    </div>
  </div>
</div>
<div class="rotate-hint">Turn your phone sideways for a bigger beach.</div>

<script>
(() => {
'use strict';

/* ---------- Personalise me ---------- */
const DEDICATION = 'Made with <b>love</b>, just for you';
const FINAL_NOTE = 'Every pirate is gone and the honey is safe. Thanks for playing, you are my favourite bear.';

/* ---------- Constants ---------- */
const W = 1280, H = 720, COLS = 9, ROWS = 5, CW = 100, CH = 108, GX = 200, GY = 148;
const CARD_X0 = 128, CARD_W = 84, CARD_GAP = 8, CARD_Y = 16, CARD_H = 110;
const SHOVEL_X = CARD_X0 + 7 * (CARD_W + CARD_GAP);
const BTNS = { speed: [1088, 70], music: [1158, 70], pause: [1228, 70] };
const INK = '#3b2412';
const TAU = Math.PI * 2;
const HAS_FILTER = typeof CanvasRenderingContext2D !== 'undefined' && 'filter' in CanvasRenderingContext2D.prototype;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD = px => `${px}px "Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif`;
const FB = px => `800 ${px}px "Nunito",system-ui,sans-serif`;

const BEARS = {
  honey:   { name: 'Honey Bear',     cost: 50,  cd: 7.5, hp: 300,  desc: 'Makes a drop of honey every so often. Plant lots of these first!' },
  berry:   { name: 'Berry Tosser',   cost: 100, cd: 7.5, hp: 300,  desc: 'Throws blueberries at any pirate in its row.' },
  panda:   { name: 'Panda Wall',     cost: 50,  cd: 30,  hp: 4000, desc: 'A big cuddly blocker. Pirates get stuck trying to get past it while it munches bamboo.' },
  hive:    { name: 'Bee Boom',       cost: 150, cd: 35,  hp: 99999, desc: 'A very grumpy beehive. It bursts right away and blasts every pirate close by.' },
  polar:   { name: 'Snowball Polar', cost: 175, cd: 7.5, hp: 300,  desc: 'Throws snowballs that make pirates shiver and slow down.' },
  twin:    { name: 'Twin Cubs',      cost: 200, cd: 7.5, hp: 300,  desc: 'Two little cubs, twice the blueberries.' },
  grizzly: { name: 'Grizzly Swipe',  cost: 150, cd: 20,  hp: 900,  desc: 'Swats every pirate right in front of it. Big hugs, bigger claws.' }
};

const PIRATES = {
  deckhand: { name: 'Deckhand',   hp: 200,  armor: 0,    speed: 16, dps: 55, cost: 1,  scale: 1,    shirt: '#d9434f', pants: '#3d4f7a', band: '#d9434f', peg: true },
  flag:     { name: 'Flag Pirate', hp: 200, armor: 0,    speed: 21, dps: 55, cost: 1,  scale: 1,    shirt: '#d9434f', pants: '#3d4f7a', band: '#2e2e3a' },
  barrel:   { name: 'Barrel Pirate', hp: 200, armor: 370, speed: 15, dps: 55, cost: 2, scale: 1,   shirt: '#3a6fc4', pants: '#5a3b26', band: '#3a6fc4' },
  runner:   { name: 'Swashbuckler', hp: 280, armor: 0,   speed: 34, dps: 70, cost: 3, scale: .95,  shirt: '#2f9e67', pants: '#2b2b3a', band: '#2f9e67' },
  captain:  { name: 'Captain',    hp: 200,  armor: 1100, speed: 15, dps: 60, cost: 4, scale: 1.05, shirt: '#c23a3a', pants: '#2b2b3a', band: '#2e2e3a' },
  bosun:    { name: 'Big Bosun',  hp: 2200, armor: 0,    speed: 11, dps: 0,  cost: 10, scale: 1.38, shirt: '#2e4f8f', pants: '#4a3426', band: '#8f8f9a', w: 26 }
};

const ALL = ['honey', 'berry', 'panda', 'hive', 'polar', 'twin', 'grizzly'];
const LEVELS = [
  { name: 'Picnic Day', bears: ALL.slice(0, 2), waves: 6, flags: [5], b0: 1, grow: .6, first: 24, reward: 'panda',
    pool: [['deckhand', 1, 0]], tip: '' },
  { name: 'Low Tide', bears: ALL.slice(0, 3), waves: 8, flags: [7], b0: 1.5, grow: .75, first: 20, reward: 'hive',
    pool: [['deckhand', 3, 0], ['barrel', 2, 2]], tip: 'Panda Walls are cheap and tough. Put them in front of your tossers.' },
  { name: 'Jolly Roger Bay', bears: ALL.slice(0, 4), waves: 10, flags: [4, 9], b0: 2, grow: .85, first: 20, reward: 'polar',
    pool: [['deckhand', 3, 0], ['barrel', 2, 1], ['captain', 1, 4]], tip: 'Save a Bee Boom for when lots of pirates bunch up.' },
  { name: 'Frosty Cove', bears: ALL.slice(0, 5), waves: 10, flags: [4, 9], b0: 2.4, grow: .95, first: 20, reward: 'twin',
    pool: [['deckhand', 3, 0], ['barrel', 2, 0], ['runner', 2, 2], ['captain', 1, 4]], tip: 'Snowballs slow pirates down, which is great against fast Swashbucklers.' },
  { name: 'Cannonball Coast', bears: ALL.slice(0, 6), waves: 12, flags: [5, 11], b0: 2.2, grow: .8, first: 20, reward: 'grizzly',
    pool: [['deckhand', 3, 0], ['barrel', 2, 0], ['runner', 2, 1], ['captain', 2, 3]], tip: 'Twin Cubs cost a lot but throw twice as many berries.' },
  { name: 'The Big Bosun', bears: ALL.slice(0, 7), waves: 14, flags: [6, 13], b0: 2.6, grow: .9, first: 20, reward: null,
    pool: [['deckhand', 3, 0], ['barrel', 2, 0], ['runner', 2, 0], ['captain', 2, 2], ['bosun', 1, 6]], tip: 'The Big Bosun smashes bears with his anchor. Hit him early and hard.' }
];

/* ---------- Helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function paint(c, fill, stroke, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 3; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); }
}
function circle(c, x, y, r, fill, stroke, lw) { c.beginPath(); c.arc(x, y, r, 0, TAU); paint(c, fill, stroke, lw); }
function ellipse(c, x, y, rx, ry, fill, stroke, lw, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, TAU); paint(c, fill, stroke, lw); }
function line(c, x1, y1, x2, y2, col, lw) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke(); }
function outlinedText(c, text, x, y, size, fill, stroke, lw, align) {
  c.font = FD(size); c.textAlign = align || 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = lw || size * .22; c.strokeStyle = stroke || INK;
  c.strokeText(text, x, y); c.fillStyle = fill; c.fillText(text, x, y);
}
const cellX = col => GX + col * CW + CW / 2;
const rowY = row => GY + row * CH + CH - 16;
function popEase(t) { t = clamp(t, 0, 1); const s = 1.7; t -= 1; return t * t * ((s + 1) * t + s) + 1; }

/* ---------- Audio ---------- */
let AC = null, master = null, sfxGain = null, musicGain = null, noiseBuf = null, musicTimer = null;
let musicOn = true, musicStep = 0, nextNoteT = 0;
const STEP = 60 / 138 / 2;
const MEL = [62,-1,65,67, 69,-1,69,67, 65,-1,62,-1, 64,65,67,-1, 69,-1,72,70, 69,-1,67,65, 64,-1,60,-1, 62,-1,-1,0,
             74,-1,72,70, 69,-1,67,69, 70,-1,69,67, 65,-1,64,-1, 62,-1,65,67, 69,-1,67,65, 64,-1,61,64, 62,-1,-1,0];
const BASS = [50, 46, 53, 48, 46, 43, 50, 45];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = .5; sfxGain.connect(master);
    musicGain = AC.createGain(); musicGain.gain.value = musicOn ? .2 : 0; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNoteT = AC.currentTime + .1;
    musicTimer = setInterval(scheduleMusic, 50);
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, when, slide, dest) {
  if (!AC) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol, freq, when) {
  if (!AC) return;
  const t0 = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t0, Math.random() * .5); s.stop(t0 + dur + .05);
}
const SFX = {
  pop() { tone(420, .14, 'sine', .35, 0, 900); },
  throw() { tone(650, .08, 'triangle', .12, 0, 1100); },
  hit() { tone(170, .08, 'square', .05, 0, 90); noise(.05, .1, 1800); },
  honey() { [880, 1175, 1568].forEach((f, i) => tone(f, .16, 'sine', .16, i * .055)); },
  boom() { noise(.8, .7, 600); tone(110, .6, 'sine', .5, 0, 35); },
  munch() { noise(.05, .07, 900); },
  armor() { noise(.14, .25, 2600); tone(300, .1, 'square', .05, 0, 150); },
  arr() { tone(190, .4, 'sawtooth', .05, 0, 120); },
  horn() { tone(147, 1.1, 'sawtooth', .1, 0, 150); tone(220, 1.1, 'sawtooth', .07, 0, 222); },
  swipe() { noise(.16, .22, 3200); tone(420, .12, 'triangle', .1, 0, 180); },
  sad() { tone(440, .3, 'triangle', .14, 0, 280); },
  roll() { tone(160, .7, 'triangle', .25, 0, 520); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .32, 'triangle', .22, i * .12)); },
  lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, .4, 'triangle', .2, i * .22)); },
  select() { tone(660, .06, 'sine', .14); },
  freeze() { tone(1500, .12, 'sine', .08, 0, 2300); },
  deny() { tone(190, .12, 'square', .06); },
  smash() { noise(.3, .5, 500); tone(90, .3, 'sine', .4, 0, 40); }
};
function sfx(n) { if (AC) try { SFX[n](); } catch (e) {} }
function scheduleMusic() {
  if (!AC) return;
  if (nextNoteT < AC.currentTime) nextNoteT = AC.currentTime + .05;
  while (nextNoteT < AC.currentTime + .25) {
    const i = musicStep, t = nextNoteT - AC.currentTime;
    const m = MEL[i];
    if (m > 0) {
      let len = 1; while (MEL[(i + len) % 64] === -1) len++;
      tone(mtof(m), len * STEP * .9, 'triangle', .35, t, null, musicGain);
      tone(mtof(m + 12), len * STEP * .5, 'sine', .06, t, null, musicGain);
    }
    if (i % 8 === 0) tone(mtof(BASS[i / 8 | 0] - 12), STEP * 3.4, 'triangle', .4, t, null, musicGain);
    if (i % 8 === 4) tone(mtof(BASS[i / 8 | 0] - 5), STEP * 3.4, 'triangle', .3, t, null, musicGain);
    musicStep = (musicStep + 1) % 64; nextNoteT += STEP;
  }
}
function setMusic(on) { musicOn = on; if (musicGain) musicGain.gain.setTargetAtTime(on ? .2 : 0, AC.currentTime, .1); save(); }

/* ---------- Save data ---------- */
let progress = 0, beatGame = false;
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('bears-vs-pirates') || '{}');
    progress = clamp(d.progress | 0, 0, LEVELS.length - 1); beatGame = !!d.beat;
    if (d.music === false) musicOn = false;
  } catch (e) {}
}
function save() {
  try { localStorage.setItem('bears-vs-pirates', JSON.stringify({ progress, beat: beatGame, music: musicOn })); } catch (e) {}
}

/* ---------- Canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');
const bgx = bg.getContext('2d');
let scale = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  if (r.width < 10) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(r.width * dpr);
  if (bw === canvas.width) return;
  canvas.width = bw; canvas.height = Math.round(bw * 9 / 16);
  bg.width = canvas.width; bg.height = canvas.height;
  scale = bw / W;
  drawBackground();
}

/* ---------- Background (pre-rendered) ---------- */
function flower(c, x, y, col, s) {
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; circle(c, x + Math.cos(a) * 3.4 * s, y + Math.sin(a) * 3.4 * s, 2.8 * s, col); }
  circle(c, x, y, 2 * s, '#f6b73c');
}
function drawBackground() {
  const c = bgx, R = mulberry32(11);
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, bg.width, bg.height);
  c.setTransform(scale, 0, 0, scale, 0, 0);
  // meadow
  c.fillStyle = '#6fb34f'; c.fillRect(0, 0, W, H);
  // lawn tiles
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {

  // front arm + weapon
  if (p.type === 'bosun') {
    const sm = p.smashT > 0 ? Math.pow(clamp(p.smashT / 1.2, 0, 1), 3) : 0;
    const a = p.smashT > 0 ? -2.4 + sm * 3 : -.5 + Math.sin(phase) * .1;

    circle(c, 0, 20, 6.5, SKIN, INK, 2.2);
    // anchor

    rrect(c, -3, -2, 6, 40, 2); paint(c, '#6b6b78', INK, 2.2);
    circle(c, 0, -6, 5, null, INK, 3);
    c.beginPath(); c.moveTo(-16, 30); c.quadraticCurveTo(0, 50, 16, 30); c.strokeStyle = INK; c.lineWidth = 7; c.stroke();
    c.strokeStyle = '#6b6b78'; c.lineWidth = 4; c.stroke();
    rrect(c, -10, 4, 20, 5, 2); paint(c, '#6b6b78', INK, 2);

  } else {

    rrect(c, -5, -2, 10, 18, 5); paint(c, p.type === 'captain' ? '#c23a3a' : k.shirt, INK, 2.4);

  if (p.slow > 0 && !p.dying) {
    c.save(); c.translate(p.x + 6, p.y - 120 * s);

}

/* ---------- Game state ---------- */
const S = {
  scene: 'title', level: 0, honey: 150, bears: [], pirates: [], shots: [], drops: [], parts: [], rollers: [], grid: [],
  cards: [], selected: null, shovel: false, time: 0, skyT: 6, wave: -1, waveT: 0, waves: [], queue: [], banner: null,
  intro: 0, speed: 1, paused: false, shake: 0, prize: null, ended: false, collected: 0, warned: false, lastKill: null,
  pointer: { x: -1, y: -1, in: false }, drag: null, clock: 0
};

function buildWaves(L) {
  const waves = [];
  for (let w = 0; w < L.waves; w++) {
    const flag = L.flags.includes(w);
    let budget = Math.round((L.b0 + w * L.grow) * (flag ? 2.2 : 1));
    const list = flag ? ['flag'] : [];
    const avail = L.pool.filter(([, , from]) => w >= from);
    for (let guard = 0; budget > 0 && guard < 100; guard++) {
      const fit = avail.filter(([tp]) => PIRATES[tp].cost <= budget);
      if (!fit.length) break;
      let r = Math.random() * fit.reduce((a, [, wt]) => a + wt, 0), pick = fit[0][0];
      for (const [tp, wt] of fit) { r -= wt; if (r <= 0) { pick = tp; break; } }
      list.push(pick); budget -= PIRATES[pick].cost;
    }
    if (!list.length) list.push('deckhand');
    waves.push({ list, flag });
  }
  return waves;
}

function startLevel(i) {
  const L = LEVELS[i];
  Object.assign(S, {
    scene: 'play', level: i, honey: 150, bears: [], pirates: [], shots: [], drops: [], parts: [], selected: null, shovel: false,
    time: 0, skyT: 5, wave: -1, waveT: L.first, queue: [], banner: null, intro: 2.6, shake: 0, prize: null, ended: false,
    collected: 0, warned: false, lastKill: null, paused: false, drag: null
  });
  S.grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  S.rollers = Array.from({ length: ROWS }, (_, r) => ({ row: r, x: 150, state: 'idle', rot: 0 }));
  S.cards = L.bears.map(tp => ({ type: tp, cd: tp === 'hive' || tp === 'grizzly' ? BEARS[tp].cd * .5 : 0 }));
  S.waves = buildWaves(L);
  showOverlay(null);
  initAudio();
}

function banner(text, dur, color) { S.banner = { text, t: 0, dur, color: color || '#fff5df' }; }

/* ---------- Actions ---------- */
function placeBear(type, r, col) {
  const k = BEARS[type], card = S.cards.find(cd => cd.type === type);
  if (!card || S.grid[r][col] || S.honey < k.cost || card.cd > 0) { sfx('deny'); return false; }
  S.honey -= k.cost; card.cd = k.cd;
  const b = { type, row: r, col, x: cellX(col), y: rowY(r), hp: k.hp, maxHp: k.hp, timer: .5, anim: 0, spawn: 0, seed: Math.random() * 10, hurt: 0, glow: 0 };
  if (type === 'honey') b.timer = rand(5, 8);
  if (type === 'hive') b.fuse = 1.1;
  S.grid[r][col] = b; S.bears.push(b);
  puff(b.x, b.y - 20, '#ffffff', 10);
  sfx('pop');
  return true;
}
function digBear(b) {
  b.dead = true; S.grid[b.row][b.col] = null;
  puff(b.x, b.y - 20, '#c9a77a', 10); sfx('select');
}
function puff(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(60, 200);
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 300, life: rand(.35, .7), max: .7, r: rand(4, 9), col, kind: 'dot' });
  }
}
function stars(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(80, 220);
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, g: 400, life: rand(.4, .8), max: .8, r: rand(5, 9), col: '#ffe066', kind: 'star', rot: rand(0, TAU), vr: rand(-8, 8) });
  }
}
function dropHoney(x, y, ty, fromBear) {
  if (fromBear) S.drops.push({ x, y, ty, vx: rand(-40, 40), vy: -260, arc: true, state: 'fall', t: 0, value: 25 });
  else S.drops.push({ x, y, ty, vx: 0, vy: 70, arc: false, state: 'fall', t: 0, value: 25 });
}
function collectDrop(d) {
  d.state = 'fly'; d.ft = 0; d.sx = d.x; d.sy = d.y;
  S.honey = Math.min(9990, S.honey + d.value); S.collected++;
  sfx('honey');
}
function enemyAhead(b) { return S.pirates.some(p => !p.dying && p.row === b.row && p.x > b.x - 5 && p.x < W - 40); }
function fire(b, second) {
  const twin = b.type === 'twin';
  S.shots.push({ row: b.row, x: b.x + (twin ? (second ? -2 : 26) : 24), y: b.y - (twin ? (second ? 44 : 38) : 52), kind: b.type === 'polar' ? 'snow' : 'berry', dmg: 20, spin: 0 });
  sfx('throw');
}
function hurt(p, dmg, kind) {
  if (p.dying) return;
  if (p.armor > 0) {
    const a = Math.min(p.armor, dmg); p.armor -= a; dmg -= a;
    if (p.armor <= 0) armorBreak(p);
  }
  p.hp -= dmg; p.flash = .1;
  if (p.hp <= 0) killPirate(p, kind);
}
function armorBreak(p) {
  const s = PIRATES[p.type].scale;
  if (p.type === 'barrel') for (let i = 0; i < 5; i++) S.parts.push({ x: p.x, y: p.y - 50, vx: rand(-120, 160), vy: rand(-320, -150), g: 900, life: 1, max: 1, kind: 'plank', rot: rand(0, TAU), vr: rand(-10, 10) });
  if (p.type === 'captain') S.parts.push({ x: p.x, y: p.y - 112 * s, vx: rand(60, 140), vy: -380, g: 900, life: 1.1, max: 1.1, kind: 'hat', rot: 0, vr: 7 });
  sfx('armor');
}
function killPirate(p, how) {
  if (p.dying) return;
  p.dying = true; p.deadT = 0; p.how = how; p.eating = false;
  S.lastKill = { x: clamp(p.x, GX + 60, GX + CW * COLS - 60), y: clamp(p.y - 40, GY + 40, GY + CH * ROWS - 40) };
  stars(p.x, p.y - 60, how === 'boom' ? 3 : 6);
  if (how === 'boom') puff(p.x, p.y - 50, '#6b6b78', 8);
  if (p.type === 'captain' && p.armor > 0) armorBreak(p);
  if (Math.random() < .35) sfx('arr');
}
function explode(b) {
  b.dead = true; S.grid[b.row][b.col] = null;
  for (const p of S.pirates) if (!p.dying && Math.abs(p.row - b.row) <= 1 && Math.abs(p.x - b.x) <= CW * 1.5) { p.armor = 0; killPirate(p, 'boom'); }
  for (let i = 0; i < 26; i++) {
    const a = rand(0, TAU), sp = rand(120, 420);
    S.parts.push({ x: b.x, y: b.y - 40, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 200, life: rand(.4, .9), max: .9, r: rand(6, 14), col: i % 2 ? '#f6b73c' : '#ffd36b', kind: 'dot' });
  }
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), sp = rand(80, 260);
    S.parts.push({ x: b.x, y: b.y - 40, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -20, life: rand(.9, 1.5), max: 1.5, kind: 'bee', rot: 0, vr: 0 });
  }
  S.parts.push({ x: b.x, y: b.y - 40, vx: 0, vy: 0, g: 0, life: .45, max: .45, kind: 'ring', r: 160 });
  S.shake = 16; sfx('boom');
}
function bearHurt(b, dmg) {
  b.hp -= dmg; b.hurt = .08;
  if (b.hp <= 0 && !b.dead) { b.dead = true; S.grid[b.row][b.col] = null; puff(b.x, b.y - 30, '#d8b48a', 12); sfx('sad'); }
}

/* ---------- Update ---------- */
function update(dt) {
  S.clock += dt;
  if (S.banner) { S.banner.t += dt; if (S.banner.t > S.banner.dur) S.banner = null; }
  updateParticles(dt);
  if (S.scene !== 'play') return;
  if (S.intro > 0) { S.intro -= dt; return; }
  S.time += dt;
  S.shake = Math.max(0, S.shake - dt * 40);
  const L = LEVELS[S.level];

  for (const cd of S.cards) cd.cd = Math.max(0, cd.cd - dt);

  // sky honey
  if (!S.ended) {
    S.skyT -= dt;
    if (S.skyT <= 0) { S.skyT = rand(8, 10.5); dropHoney(rand(GX + 40, GX + CW * COLS - 40), GY - 10, rand(GY + 60, GY + CH * ROWS - 30), false); }
  }

  // waves
  const alive = S.pirates.reduce((n, p) => n + (p.dying ? 0 : 1), 0);
  if (S.wave < S.waves.length - 1) {
    S.waveT -= dt;

    const next = S.waves[S.wave + 1];

    if (S.waveT <= 0) {
      S.wave++; S.warned = false;

      const spread = w.flag ? 6 : 3.5;
      let rows = [];
      w.list.forEach((tp, i) => {
        if (!rows.length) rows = [0, 1, 2, 3, 4].sort(() => Math.random() - .5);
        S.queue.push({ type: tp, row: rows.pop(), at: S.time + (i === 0 ? 0 : rand(0, spread)) });
      });

      slow: 0, eating: false, walkT: rand(0, 3), flash: 0, dying: false, deadT: 0, seed: rand(0, 10), smashT: 0, chompT: 0 });
  }

      case 'berry': case 'twin': case 'polar':

        if (b.timer === 0 && enemyAhead(b)) { fire(b, false); b.timer = 1.35; b.anim = 1; if (b.type === 'twin') b.pending = .22; }
        break;

  }

  // pirates
  for (const p of S.pirates) {
    p.flash = Math.max(0, p.flash - dt);
    if (p.dying) { p.deadT += dt; continue; }
    p.slow = Math.max(0, p.slow - dt);
    const k = PIRATES[p.type], slowF = p.slow > 0 ? .5 : 1;
    let target = null;
    for (const b of S.bears) if (!b.dead && b.row === p.row && b.type !== 'hive' && p.x - b.x > -5 && p.x - b.x < 48) { target = b; break; }
    if (target && p.x < W - 60) {
      p.eating = true;

        p.smashT += dt * slowF;
        if (p.smashT >= 1.2) { p.smashT = 0; bearHurt(target, 99999); S.shake = Math.max(S.shake, 10); sfx('smash'); puff(target.x, target.y - 8, '#c9a77a', 14); }
      } else {

      else if (R.state !== 'rolling' && p.x < 95) { lose(); return; }

    if (R.x > W + 60) R.state = 'gone';

  S.pirates = S.pirates.filter(p => !(p.dying && p.deadT > .9));
  S.shots = S.shots.filter(s => !s.dead);
  S.drops = S.drops.filter(d => !d.dead);

  // victory
  if (!S.ended && S.wave === S.waves.length - 1 && !S.queue.length && !S.pirates.some(p => !p.dying)) {
    S.ended = true;
    const at = S.lastKill || { x: GX + CW * 6, y: GY + CH * 2.5 };
    S.prize = { x: at.x, y: at.y, t: 0, type: L.reward };
    banner(L.reward ? 'Tap the prize!' : 'Tap the golden honey!', 3);
    sfx('win');
  }

}
function updateParticles(dt) {

    if (p.vr) p.rot += p.vr * dt;

}

    if (!musicOn) line(ctx, x - 14, y - 14, x + 16, y + 16, '#e8606f', 4);
  }, false);
  hudButton(BTNS.pause, () => { const [x, y] = BTNS.pause; rrect(ctx, x - 9, y - 11, 6, 22, 2); paint(ctx, INK); rrect(ctx, x + 3, y - 11, 6, 22, 2); paint(ctx, INK); }, false);

  // bottom strip: hint + progress
  let hint = '';
  if (S.level === 0 && S.scene === 'play') {
    if (!S.bears.some(b => b.type === 'honey') && S.time < 60) hint = 'Tap the Honey Bear card, then tap the grass to plant it.';
    else if (S.collected < 2 && S.time < 90) hint = 'Tap the golden honey drops to collect them.';
    else if (!S.bears.some(b => b.type === 'berry') && S.time < 120) hint = 'Plant a Berry Tosser. It throws blueberries at pirates.';
    else if (S.time < 100) hint = 'Pirates wade in from the sea on the right. Fill every row!';
  } else if (S.time < 25 && L.tip) hint = L.tip;
  if (hint) {
    ctx.font = FB(17); ctx.textAlign = 'left'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,50,20,.7)'; ctx.lineJoin = 'round';
    ctx.strokeText(hint, 24, 704); ctx.fillStyle = '#fff5df'; ctx.fillText(hint, 24, 704);
  }
  const px = 1000, pw = 250, py = 704;
  rrect(ctx, px, py - 9, pw, 18, 9); paint(ctx, 'rgba(30,50,20,.55)', INK, 2.5);
  const prog = S.waves.length ? clamp((S.wave + 1 - Math.max(0, S.waveT) / 30 * (S.wave < S.waves.length - 1 ? 1 : 0)) / S.waves.length, 0, 1) : 0;
  const fillW = Math.max(0, pw * prog - 4);
  if (fillW > 2) { rrect(ctx, px + pw - 2 - fillW, py - 7, fillW, 14, 7); paint(ctx, '#e8606f'); }
  for (const f of LEVELS[S.level].flags) {
    const fx = px + pw - (f + 1) / S.waves.length * pw + 6;
    line(ctx, fx, py + 6, fx, py - 20, INK, 2.5);
    ctx.beginPath(); ctx.moveTo(fx, py - 20); ctx.lineTo(fx + 14, py - 16); ctx.lineTo(fx, py - 11); ctx.closePath(); paint(ctx, '#2e2e3a', INK, 1.5);
    circle(ctx, fx + 5, py - 16, 2, '#fff');
  }
  // pirate head marker
  const mx = px + pw - pw * prog;
  circle(ctx, mx, py, 10, SKIN, INK, 2.2);
  ctx.beginPath(); ctx.arc(mx, py, 10.5, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); paint(ctx, '#d9434f', INK, 2);
  ellipse(ctx, mx + 2, py + 1, 2.8, 2.4, '#1f1f26');
}
function hudButton([x, y], drawIcon, active) {
  circle(ctx, x, y + 3, 27, INK);
  circle(ctx, x, y, 27, active ? '#ffc95e' : '#f6b73c', INK, 3);
  drawIcon();
}

/* ---------- Input ---------- */
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function cellAt(x, y) {
  if (x < GX || x >= GX + COLS * CW || y < GY || y >= GY + ROWS * CH) return null;
  return { c: Math.floor((x - GX) / CW), r: Math.floor((y - GY) / CH) };
}
function cardAt(x, y) {
  if (y < CARD_Y - 8 || y > CARD_Y + CARD_H) return -1;
  for (let i = 0; i < S.cards.length; i++) { const cx = CARD_X0 + i * (CARD_W + CARD_GAP); if (x >= cx && x <= cx + CARD_W) return i; }
  if (x >= SHOVEL_X && x <= SHOVEL_X + CARD_W) return 'shovel';
  return -1;
}
function selectCard(i) {
  const card = S.cards[i]; if (!card) return;
  const k = BEARS[card.type];
  if (S.selected === card.type) { S.selected = null; return; }
  if (card.cd > 0 || S.honey < k.cost) { sfx('deny'); return; }
  S.selected = card.type; S.shovel = false; sfx('select');
}
function tryPlaceAt(x, y) {
  const hc = cellAt(x, y);
  if (!hc || !S.selected) return false;
  if (placeBear(S.selected, hc.r, hc.c)) { S.selected = null; return true; }
  return false;
}
canvas.addEventListener('pointerdown', e => {
  initAudio();
  const p = toGame(e);
  S.pointer = { x: p.x, y: p.y, in: true };
  if (S.scene !== 'play' || S.paused) return;
  e.preventDefault();
  // HUD buttons
  for (const [name, [bx, by]] of Object.entries(BTNS)) {
    if (Math.hypot(p.x - bx, p.y - by) < 30) {
      if (name === 'pause') pause(true);
      else if (name === 'speed') { S.speed = S.speed === 1 ? 2 : 1; sfx('select'); }
      else if (name === 'music') setMusic(!musicOn);
      return;
    }
  }
  if (S.intro > 0) return;
  if (S.prize && Math.hypot(p.x - S.prize.x, p.y - S.prize.y) < 70) { claimPrize(); return; }
  // honey (topmost first)
  for (let i = S.drops.length - 1; i >= 0; i--) {
    const d = S.drops[i];
    if (d.state !== 'fly' && Math.hypot(p.x - d.x, p.y - d.y) < 44) { collectDrop(d); return; }
  }
  const ci = cardAt(p.x, p.y);
  if (ci === 'shovel') { S.shovel = !S.shovel; S.selected = null; sfx('select'); return; }
  if (ci !== -1) { selectCard(ci); S.drag = S.selected ? { x: p.x, y: p.y } : null; return; }
  const hc = cellAt(p.x, p.y);
  if (hc && S.shovel) {
    const b = S.grid[hc.r][hc.c];
    if (b) digBear(b);
    S.shovel = false; return;
  }
  if (hc && S.selected) { tryPlaceAt(p.x, p.y); return; }
  S.selected = null; S.shovel = false;
});
canvas.addEventListener('pointermove', e => {
  const p = toGame(e); S.pointer = { x: p.x, y: p.y, in: true };
  if (S.scene !== 'play' || S.paused) return;
  // sweep-collect honey while moving with a mouse
  if (e.pointerType === 'mouse') {
    for (const d of S.drops) if (d.state === 'rest' && Math.hypot(p.x - d.x, p.y - d.y) < 26) collectDrop(d);
  }
});
canvas.addEventListener('pointerup', e => {
  const p = toGame(e);
  if (S.drag && S.selected && Math.hypot(p.x - S.drag.x, p.y - S.drag.y) > 24) tryPlaceAt(p.x, p.y);
  S.drag = null;
  if (e.pointerType !== 'mouse') S.pointer.in = !!S.selected || S.shovel;
});
canvas.addEventListener('pointerleave', () => { S.pointer.in = false; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); S.selected = null; S.shovel = false; });
window.addEventListener('keydown', e => {
  if (S.scene !== 'play') return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (S.selected || S.shovel) { S.selected = null; S.shovel = false; }
    else pause(!S.paused);
    return;
  }
  if (S.paused || S.intro > 0) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 7) selectCard(n - 1);
  if (e.key === 's' || e.key === 'S') { S.shovel = !S.shovel; S.selected = null; }
  if (e.key === 'f' || e.key === 'F') S.speed = S.speed === 1 ? 2 : 1;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.scene === 'play' && !S.paused) pause(true); });

/* ---------- Menus ---------- */
const OVERLAYS = ['ov-title', 'ov-levels', 'ov-pause', 'ov-win', 'ov-lose'];
function showOverlay(id) {
  for (const o of OVERLAYS) document.getElementById(o).hidden = o !== id;
  const el = id && document.getElementById(id).querySelector('button:not([hidden]):not(:disabled)');
  if (el) el.focus({ preventScroll: true });
}
function pause(on) {
  if (S.scene !== 'play') return;
  S.paused = on;
  showOverlay(on ? 'ov-pause' : null);
}
function openLevels() {
  S.scene = 'levels';
  const wrap = document.getElementById('levels'); wrap.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lvl' + (i < progress || (i === LEVELS.length - 1 && beatGame) ? ' done' : '');
    b.id = 'lvl-' + i;
    const locked = i > progress;
    b.disabled = locked;
    const sub = locked ? 'Locked' : L.reward ? 'Win: ' + BEARS[L.reward].name : 'The final beach';
    b.innerHTML = `<span class="n">${i + 1}</span><span class="nm">${L.name}</span><span class="sub">${sub}</span>`;
    b.addEventListener('click', () => { initAudio(); sfx('pop'); startLevel(i); });
    wrap.appendChild(b);
  });
  showOverlay('ov-levels');
}
function toTitle() { S.scene = 'title'; showOverlay('ov-title'); }
document.getElementById('dedication').innerHTML = DEDICATION + ' <b>♥</b>';
document.getElementById('btn-play').addEventListener('click', () => { initAudio(); sfx('pop'); openLevels(); });
document.getElementById('btn-back').addEventListener('click', toTitle);
document.getElementById('btn-resume').addEventListener('click', () => pause(false));
document.getElementById('btn-restart').addEventListener('click', () => startLevel(S.level));
document.getElementById('btn-retry').addEventListener('click', () => startLevel(S.level));
document.getElementById('btn-next').addEventListener('click', () => startLevel(Math.min(S.level + 1, LEVELS.length - 1)));
for (const id of ['btn-map1', 'btn-map2', 'btn-map3']) document.getElementById(id).addEventListener('click', openLevels);

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now) {
  const t = now / 1000;
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!(S.scene === 'play' && S.paused)) {
    const steps = S.scene === 'play' ? S.speed : 1;
    for (let i = 0; i < steps; i++) update(dt);
  }
  render(t);
  requestAnimationFrame(frame);
}

function start(data) {
  load();
  if (data && typeof data.progress === 'number') progress = Math.max(progress, data.progress);
  window.claude?.hot?.snapshot?.(() => ({ progress }));
  new ResizeObserver(resize).observe(canvas);
  resize();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load(FD(20)), document.fonts.load(FB(16))]).catch(() => {}).then(() => drawBackground());
  }
  toTitle();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
